name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff==0.8.6
      - name: Ruff (syntax errors and undefined names)
        run: ruff check . --select E9,F63,F7,F82
      - name: Pytest (pipeline + Streamlit AppTest smoke tests)
        run: pytest -v
